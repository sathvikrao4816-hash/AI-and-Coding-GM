<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Harry Potter</title>
    <link rel="stylesheet" href="style.css">
    <!--For Socials by Bootstrap-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="signup-body">
    <!--Back button-->
    <a href="index.html" class="back-btn"><i class="fa-solid fa-chevron-left"></i></a>
    <div class="signup-container">
    <!--Logo-->
    <h1 class="hp-logo">Harry Potter</h1>
    <!--Section Title-->
    <div class="title-with-lines">
        <span></span>
        <h2>Log In</h2>
        <span></span>
    </div>
    <p class="subtitle">Enjoy the magical features including the official sorting ceremony, portrait maker and more!</p>
    <!--Login Form-->
        <form id="loginForm" class="signup-form">
            <div class="form-group">
                <label for="email">EMAIL ADDRESS</label>
                <input type="email" id="email" placeholder="someome@example.com" required>
         </div>
            <div class="form-group">
                <label for="password">PASSWORD</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Make a secure password" required>
                    <i class="fa-regular fa-eye" id="togglePassword"></i>
                </div>
            </div>
            
            <button type="submit" class="btn btn-solid-blue btn-full">LOG IN</button>
            
            <p>Don't have an account?</p>
            <button class="btn btn-outline" onclick="window.location.href = 'signup.html'">SIGN UP</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
