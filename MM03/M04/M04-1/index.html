<!DOCTYPE html>
<html>
    <head>
        <title>the lab</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>
    <body class="bg-light text dark">
        <div class="jumbotron jumbotron-fluid bg-info p-5">
            <h1>The Lab</h1>
            <p class="lead">Look at the progress of the experiments conducted</p>
            <button class="btn btn-danger">Chemistry</button>
            <button class="btn btn-warning">Biology</button>
            <button class="btn btn-primary">Physics</button>
            <button class="btn btn-success">Astronomy</button>
        </div>
        <div class="container fw-bold">
            <h2 class="text-success bg-info mb-4"> Completed Experiments <span class="badge text bg-light text-dark">4</span></h2>
            <p class="text-success bg-info mb-4"> Chemistry <span class="badge text bg-danger">3</span></p>
            <p class="text-success bg-info mb-4"> Biology<span class="badge text bg-warning">5</span></p>
            <p class="text-success bg-info mb-4">Physics<span class="badge text bg-primary">1</span></p>
            <p class="text-success bg-info mb-4">Astronomy<span class="badge text bg-success">6</span></p>
            
            <h3 class="text-success">Progress of Research</h3>
            <p>Chemistry</p>
            <div class="progress">
                <div class="progress-bar text-bg-danger" style="width: 70%;">
                   70% 
                </div>
            </div>
            <p>Biology</p>
            <div class="progress">
                <div class="progress-bar text-bg-warning" style="width: 50%;">
                    50%
                </div>
            </div>
            <p>Physics</p>
            <div class="progress">
                <div class="progress-bar text-bg-primary" style="width: 23%;">
                    23%
                </div>
            </div>
            <p>Astronomy</p>
            <div class="progress">
                <div class="progress-bar text-bg-success" style="width: 67%;">
                    67%
                </div>
            </div>
        </div>    
        
    </body>
</html>
