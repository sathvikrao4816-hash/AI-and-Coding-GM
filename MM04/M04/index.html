<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-5 bg-light">
  
    <div class="card-shadow-sm mx-auto" style="max-width: 360px;">
        <div class="card-body">
            <h5 class="card-title text-primary mb-5">Contact Details</h5>
            <ul class="list-group list-group-flush mb-5"></ul>
            <li class="list-group-item">Name: <strong id="name"></strong></li>
            <li class="list-group-item">School: <strong id="school"></strong></li>
            <li class="list-group-item">Phone: <strong id="phone"></strong></li>
            <li class="list-group-item">City: <strong id="city"></strong></li>
        </div>

    </div>
<script src="script.js"></script>
</body>
</html>
